{% extends "base.html" %}
{% block title %}登录 · 重复文件核查器{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>登录</h1>
  <p class="muted">单用户访问口令。忘记口令需在 NAS 上重置数据卷配置。</p>
  <form id="login-form">
    <label>口令 <input type="password" name="password" required autofocus></label>
    <button type="submit" class="primary">登录</button>
    <div class="error" id="err"></div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const r = await api('POST', '/api/v1/auth/login', {password: e.target.password.value});
  if (r.ok) { location.href = '/'; } else { err.textContent = (r.data.error || {}).message || '登录失败'; }
});
</script>
{% endblock %}
